[project]
name = "agentic-barbershop"
version = "0.1.0"
description = "Workspace root for the agentic-barbershop services"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent_service"]

[tool.pytest.ini_options]
testpaths = ["services"]
addopts = "--import-mode=importlib"
